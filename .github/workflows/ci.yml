name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=9.0.3,<10' 'pyyaml>=6,<7' 'ruff>=0.8,<1'
      - run: python -m pytest -q
      - run: python -m ruff check tests
