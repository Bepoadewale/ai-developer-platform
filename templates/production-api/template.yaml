apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata: {name: production-api, title: Production Web API, description: FastAPI service with safe platform defaults}
spec:
  owner: team-checkout
  type: service
  parameters:
    - title: Service details
      required: [name, owner, system, criticality]
      properties:
        name: {title: Name, type: string, pattern: '^[a-z][a-z0-9-]{2,48}$'}
        owner: {title: Owner, type: string, enum: [team-checkout, team-ai]}
        system: {title: System, type: string, enum: [commerce-platform, ai-platform]}
        criticality: {title: Criticality, type: string, enum: [tier-1, tier-2, tier-3]}
  steps:
    - id: fetchBase
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          criticality: ${{ parameters.criticality }}
    - id: publishLocal
      name: Persist locally
      action: platform:publishLocal
      input:
        name: ${{ parameters.name }}
  output:
    links:
      - title: Generated service workspace
        url: file://${{ steps.publishLocal.output.servicePath }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.publishLocal.output.entityRef }}
