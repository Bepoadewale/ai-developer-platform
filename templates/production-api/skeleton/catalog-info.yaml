apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name | dump }}
  description: Production Web API generated by the AI Developer Platform golden path.
  annotations:
    backstage.io/techdocs-ref: dir:.
    platform.example/golden-path: production-api
    platform.example/golden-path-version: "1.0"
    platform.example/slo-profile: ${{ values.criticality | dump }}
    platform.example/health-readiness: "/ready"
    platform.example/ci-configured: "true"
spec:
  type: service
  lifecycle: production
  owner: group:default/${{ values.owner }}
  system: system:default/${{ values.system }}
  providesApis:
    - ${{ values.name }}-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ${{ values.name }}-api
  description: HTTP API exposed by ${{ values.name }}.
spec:
  type: openapi
  lifecycle: production
  owner: group:default/${{ values.owner }}
  system: system:default/${{ values.system }}
  definition: |
    openapi: 3.0.3
    info:
      title: ${{ values.name }}
      version: 0.1.0
    paths:
      /health:
        get:
          responses:
            '200': {description: Healthy}
      /ready:
        get:
          responses:
            '200': {description: Ready}
