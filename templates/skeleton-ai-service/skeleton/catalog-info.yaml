apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name | dump }}
  description: AI service generated by the AI Developer Platform golden path.
  annotations:
    backstage.io/techdocs-ref: dir:.
    platform.example/golden-path: ai-service
    platform.example/cost-center: ${{ values.cost_center | dump }}
    platform.example/data-classification: ${{ values.data_classification | dump }}
    platform.example/model-endpoint: "/v1/infer"
    platform.example/prompt-logging-disabled: "true"
    platform.example/token-usage-telemetry: "true"
    platform.example/bounded-retries: "true"
    platform.example/health-readiness: "/ready"
    platform.example/ci-configured: "true"
    platform.example/slo-profile: tier-2-ai
spec:
  type: service
  lifecycle: production
  owner: group:default/${{ values.owner }}
  system: system:default/ai-platform
